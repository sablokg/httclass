[package]
name = "httclass"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "MIT"
authors = ["Gaurav Sablok"]
description = "Deep learning for HTT gene"
homepage = "https://codeberg.org/gsablok/httclass"
repository = "https://codeberg.org/gsablok/httclass"
keywords = ["bioinformatics","genomics"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
figlet-rs = "0.1.5"
ndarray = "0.17.2"
rayon = "1.12.0"
smartcore = { version = "0.3.0", features = ["ndarray-bindings"] }
burn = { version = "0.19.1", features = ["ndarray", "autodiff"] }
xgb = "3.0.5"
